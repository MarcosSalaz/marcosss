<style>
    * {
        box-sizing: border-box;
    }

    body {
        background: #050510;
        color: white;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    h1 {
        font-size: clamp(25px, 7vw, 40px);
        color: #4169E1;
        text-align: center;
    }

    svg {
        width: min(80vw, 350px);
        overflow: visible;
    }

    .linea {
        fill: none;
        stroke: #000080;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        filter: drop-shadow(0 0 8px #000080);
        animation: dibujar 3s ease forwards;
    }

    .relleno {
        fill: #000080;
        opacity: 0;
        animation: aparecer 1s ease forwards;
        animation-delay: 3s;
    }

    .latido {
        transform-origin: center;
        animation: latir 1s infinite;
        animation-delay: 4s;
    }

    p {
        color: #8FAAFF;
        font-size: clamp(18px, 5vw, 24px);
        text-align: center;
        padding: 0 15px;
    }

    @keyframes dibujar {
        to {
            stroke-dashoffset: 0;
        }
    }

    @keyframes aparecer {
        to {
            opacity: 0.85;
        }
    }

    @keyframes latir {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
</style>
```

</head>

<body>
